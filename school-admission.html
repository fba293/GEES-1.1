    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('gees-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. In Malaysia, one parent (mother or father) is eligible to apply for an official Long-Term Social Visit Pass (Guardian Visa) tied to the minor child's Student Pass, valid for 12 months and renewable annually. Similar provisions exist in the UK (Parent of a Child Student Visa for children aged 4-11) and Australia (Student Guardian Visa Subclass 590)."
