    />

    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('gees_theme');
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Schema.org Article / HowTo JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "How to Plan Your Study Abroad Journey",
        "description": "Step-by-step guide for international students applying to universities in UK, Australia, Malaysia, USA, and Canada.",
        "step": [
          {
            "@type": "HowToStep",
            "name": "Course & University Selection",
            "text": "Choose accredited universities and verify entry requirements and tuition fees."
          },
          {
            "@type": "HowToStep",
            "name": "Offer Letter & Scholarship Application",
            "text": "Submit academic credentials, SOP, LOR, and scholarship requests."
          },
          {
            "@type": "HowToStep",
            "name": "Student Visa Filing & Financial Proof",
            "text": "Prepare embassy financial statements, medical checkups, and visa appointment."
          },
          {
            "@type": "HowToStep",
            "name": "Pre-Departure & Campus Housing",
            "text": "Book student accommodation, flights, foreign exchange, and airport pickup."
          }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans">

  </body>
</html>
