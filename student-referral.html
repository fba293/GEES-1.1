    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('gees-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Service",
            "name": "GEES Student Referral Programme",
            "description": "Peer-to-peer student referral initiative connecting prospective international students with certified GEES admissions counselors.",
            "provider": {
              "@type": "EducationalOrganization",
              "name": "Global Education Expert Services (GEES)",
              "url": "https://gees-edu.com",
              "logo": "https://gees-edu.com/favicon.svg"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Will my referred friend have to pay GEES any consultancy fees?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. GEES provides 100% free guidance, course shortlisting, application filing, and visa counseling to prospective students with zero service charges."
                }
              },
              {
                "@type": "Question",
                "name": "Why is student consent required before submitting a referral?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We respect student privacy. We only contact prospective students who have given explicit permission to their friend to share contact details with GEES."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-white dark:bg-[#0b0f19] text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
