<!-- BEGIN: InteractiveScripts -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  // --- 1. Global Accordion Handler for Compact Rows ---
  const rowButtons = document.querySelectorAll('.filter-row-header');
  
  rowButtons.forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const targetId = btn.getAttribute('data-target');
      const content = document.getElementById(targetId);
      const chevron = btn.querySelector('.chevron-icon');
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';

      // Toggle current panel
      if (isExpanded) {
        content.classList.add('hidden');
        chevron.classList.remove('rotate-180');
        btn.setAttribute('aria-expanded', 'false');
      } else {
        content.classList.remove('hidden');
        chevron.classList.add('rotate-180');
        btn.setAttribute('aria-expanded', 'true');
      }
    });
  });

  // --- 2. Destinations Search & Select Logic ---
  const allDestCb = document.getElementById('all-destinations-cb');
  const countryCbs = document.querySelectorAll('.country-cb');
  const countryItems = document.querySelectorAll('.country-item');
  const countrySearch = document.getElementById('country-search-input');
  const destBadge = document.getElementById('destinations-badge');

  function updateDestBadge() {
    const checked = Array.from(countryCbs).filter(c => c.checked);
    if (allDestCb.checked || checked.length === 0) {
      destBadge.textContent = 'All';
      destBadge.className = 'text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 1) {
      destBadge.textContent = checked[0].value;
      destBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else {
      destBadge.textContent = `${checked.length} selected`;
      destBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    }
    updateResultTotal();
  }

  allDestCb.addEventListener('change', () => {
    if (allDestCb.checked) {
      countryCbs.forEach(c => c.checked = false);
    }
    updateDestBadge();
  });

  countryCbs.forEach(cb => {
    cb.addEventListener('change', () => {
      const anyChecked = Array.from(countryCbs).some(c => c.checked);
      allDestCb.checked = !anyChecked;
      updateDestBadge();
    });
  });

  if (countrySearch) {
    countrySearch.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      countryItems.forEach(item => {
        const name = item.querySelector('.country-name').textContent.toLowerCase();
        if (name.includes(q)) item.classList.remove('hidden');
        else item.classList.add('hidden');
      });
    });
  }

  // --- 3. Study Level Logic ---
  const allStudyCb = document.getElementById('all-studylevel-cb');
  const studyCbs = document.querySelectorAll('.studylevel-cb');
  const studyBadge = document.getElementById('studylevel-badge');

  function updateStudyBadge() {
    const checked = Array.from(studyCbs).filter(c => c.checked);
    if (allStudyCb && allStudyCb.checked) {
      studyBadge.textContent = 'All Levels';
      studyBadge.className = 'text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 0) {
      studyBadge.textContent = 'All Levels';
      studyBadge.className = 'text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 1) {
      studyBadge.textContent = checked[0].value;
      studyBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else {
      studyBadge.textContent = `${checked.length} selected`;
      studyBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    }
    updateResultTotal();
  }

  if (allStudyCb) {
    allStudyCb.addEventListener('change', () => {
      if (allStudyCb.checked) studyCbs.forEach(c => c.checked = false);
      updateStudyBadge();
    });
  }

  studyCbs.forEach(cb => {
    cb.addEventListener('change', () => {
      const anyChecked = Array.from(studyCbs).some(c => c.checked);
      if (allStudyCb) allStudyCb.checked = !anyChecked;
      updateStudyBadge();
    });
  });

  const selectAllStudyBtn = document.getElementById('select-all-studylevel-btn');
  const clearAllStudyBtn = document.getElementById('clear-all-studylevel-btn');

  if (selectAllStudyBtn) {
    selectAllStudyBtn.addEventListener('click', () => {
      studyCbs.forEach(c => c.checked = true);
      if (allStudyCb) allStudyCb.checked = false;
      updateStudyBadge();
    });
  }
  if (clearAllStudyBtn) {
    clearAllStudyBtn.addEventListener('click', () => {
      studyCbs.forEach(c => c.checked = false);
      if (allStudyCb) allStudyCb.checked = true;
      updateStudyBadge();
    });
  }

  // --- 4. Course / Discipline Logic ---
  const allDiscCb = document.getElementById('all-discipline-cb');
  const discCbs = document.querySelectorAll('.discipline-cb');
  const discBadge = document.getElementById('discipline-badge');

  function updateDiscBadge() {
    const checked = Array.from(discCbs).filter(c => c.checked);
    if (allDiscCb && allDiscCb.checked) {
      discBadge.textContent = 'All Fields';
      discBadge.className = 'text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 0) {
      discBadge.textContent = 'All Fields';
      discBadge.className = 'text-[11px] font-semibold text-amber-700 bg-amber-50 border border-amber-200/60 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 1) {
      discBadge.textContent = checked[0].value;
      discBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else {
      discBadge.textContent = `${checked.length} selected`;
      discBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    }
    updateResultTotal();
  }

  if (allDiscCb) {
    allDiscCb.addEventListener('change', () => {
      if (allDiscCb.checked) discCbs.forEach(c => c.checked = false);
      updateDiscBadge();
    });
  }
  discCbs.forEach(cb => {
    cb.addEventListener('change', () => {
      const any = Array.from(discCbs).some(c => c.checked);
      if (allDiscCb) allDiscCb.checked = !any;
      updateDiscBadge();
    });
  });

  // --- 5. IELTS Score Logic ---
  const ieltsCbs = document.querySelectorAll('.ielts-cb');
  const ieltsBadge = document.getElementById('ielts-badge');
  function updateIelts() {
    const checked = Array.from(ieltsCbs).filter(c => c.checked);
    if (checked.length === 0) {
      ieltsBadge.textContent = 'Any';
      ieltsBadge.className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 1) {
      ieltsBadge.textContent = checked[0].value;
      ieltsBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else {
      ieltsBadge.textContent = `${checked.length} selected`;
      ieltsBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    }
    updateResultTotal();
  }
  ieltsCbs.forEach(cb => cb.addEventListener('change', updateIelts));

  // --- 6. Intake Months Logic ---
  const monthBtns = document.querySelectorAll('.month-btn');
  const intakeBadge = document.getElementById('intake-badge');

  monthBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const isActive = btn.dataset.active === 'true';
      btn.dataset.active = !isActive;
      btn.classList.toggle('bg-[#121927]', !isActive);
      btn.classList.toggle('text-amber-400', !isActive);
      btn.classList.toggle('font-bold', !isActive);
      btn.classList.toggle('bg-slate-100', isActive);
      btn.classList.toggle('text-slate-700', isActive);

      const activeMonths = Array.from(document.querySelectorAll('.month-btn[data-active="true"]')).map(b => b.dataset.month);
      if (activeMonths.length === 0) {
        intakeBadge.textContent = 'Any Month';
        intakeBadge.className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';
      } else if (activeMonths.length <= 2) {
        intakeBadge.textContent = activeMonths.join(', ');
        intakeBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
      } else {
        intakeBadge.textContent = `${activeMonths.length} months`;
        intakeBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
      }
      updateResultTotal();
    });
  });

  // --- 7. Duration Logic ---
  const durationCbs = document.querySelectorAll('.duration-cb');
  const durationBadge = document.getElementById('duration-badge');
  function updateDuration() {
    const checked = Array.from(durationCbs).filter(c => c.checked);
    if (checked.length === 0) {
      durationBadge.textContent = 'Any';
      durationBadge.className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else if (checked.length === 1) {
      durationBadge.textContent = checked[0].value;
      durationBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    } else {
      durationBadge.textContent = `${checked.length} selected`;
      durationBadge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
    }
    updateResultTotal();
  }
  durationCbs.forEach(cb => cb.addEventListener('change', updateDuration));

  // --- 8. Fee Range Slider Logic ---
  const minSlider = document.getElementById('min-range-slider');
  const maxSlider = document.getElementById('max-range-slider');
  const displayMin = document.getElementById('display-min');
  const displayMax = document.getElementById('display-max');
  const highlight = document.getElementById('slider-track-highlight');
  const feeBadge = document.getElementById('fee-summary-badge');
  const clearPriceBtn = document.getElementById('clear-price-btn');
  const maxLimit = 214000;

  function updateSlider() {
    let minVal = parseInt(minSlider.value);
    let maxVal = parseInt(maxSlider.value);
    if (minVal > maxVal - 5000) minSlider.value = maxVal - 5000;
    
    const leftPercent = (minVal / maxLimit) * 100;
    const rightPercent = 100 - ((maxVal / maxLimit) * 100);

    highlight.style.left = leftPercent + '%';
    highlight.style.right = rightPercent + '%';

    displayMin.textContent = new Intl.NumberFormat().format(minVal);
    displayMax.textContent = new Intl.NumberFormat().format(maxVal);

    const minK = Math.round(minVal / 1000);
    const maxK = Math.round(maxVal / 1000);
    feeBadge.textContent = `RM ${minK}k - ${maxK}k`;
    updateResultTotal();
  }

  minSlider.addEventListener('input', updateSlider);
  maxSlider.addEventListener('input', updateSlider);

  if (clearPriceBtn) {
    clearPriceBtn.addEventListener('click', () => {
      minSlider.value = 0;
      maxSlider.value = maxLimit;
      updateSlider();
    });
  }

  // --- 9. Institution, Study Mode, QS, Tuition, Scholarship Generic Listeners ---
  function setupCheckboxGroup(cbsSelector, allCbId, badgeId, defaultLabel) {
    const cbs = document.querySelectorAll(cbsSelector);
    const allCb = allCbId ? document.getElementById(allCbId) : null;
    const badge = document.getElementById(badgeId);

    function update() {
      const checked = Array.from(cbs).filter(c => c.checked);
      if (allCb && allCb.checked) {
        badge.textContent = defaultLabel;
        badge.className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';
      } else if (checked.length === 0) {
        badge.textContent = defaultLabel;
        badge.className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';
      } else if (checked.length === 1) {
        badge.textContent = checked[0].value;
        badge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
      } else {
        badge.textContent = `${checked.length} selected`;
        badge.className = 'text-[11px] font-semibold text-white bg-[#121927] px-2 py-0.5 rounded-md max-w-[125px] truncate';
      }
      updateResultTotal();
    }

    if (allCb) {
      allCb.addEventListener('change', () => {
        if (allCb.checked) cbs.forEach(c => c.checked = false);
        update();
      });
    }

    cbs.forEach(cb => {
      cb.addEventListener('change', () => {
        if (allCb) {
          const any = Array.from(cbs).some(c => c.checked);
          allCb.checked = !any;
        }
        update();
      });
    });
  }

  setupCheckboxGroup('.institution-type-cb', 'all-institution-type-cb', 'institution-type-badge', 'All Types');
  setupCheckboxGroup('.study-mode-cb', null, 'study-mode-badge', 'All Modes');
  setupCheckboxGroup('.qs-cb', null, 'qs-ranking-badge', 'All Ranks');
  setupCheckboxGroup('.tuition-cb', null, 'tuition-fee-badge', 'All Fees');
  setupCheckboxGroup('.scholarship-cb', null, 'scholarship-badge', 'Any');

  // --- 10. Dynamic Result Count Calculator ---
  const totalCountEl = document.getElementById('filter-total-count');
  function updateResultTotal() {
    let checkedCount = document.querySelectorAll('input[type="checkbox"]:checked:not(#all-destinations-cb):not(#all-studylevel-cb):not(#all-discipline-cb):not(#all-institution-type-cb)').length;
    let activeMonths = document.querySelectorAll('.month-btn[data-active="true"]').length;
    let totalActive = checkedCount + activeMonths;
    let count = Math.max(14, 233 - (totalActive * 19));
    if (totalCountEl) totalCountEl.textContent = `${count} results`;
  }

  // --- 11. Reset All Handlers ---
  function resetAll() {
    document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
    if (allDestCb) allDestCb.checked = true;
    if (allStudyCb) allStudyCb.checked = true;
    if (allDiscCb) allDiscCb.checked = true;
    const instAll = document.getElementById('all-institution-type-cb');
    if (instAll) instAll.checked = true;

    monthBtns.forEach(btn => {
      btn.dataset.active = 'false';
      btn.className = 'month-btn py-1.5 px-0.5 rounded-md text-[11px] font-medium transition-colors text-center bg-slate-100 text-slate-700 hover:bg-slate-200';
    });

    if (minSlider && maxSlider) {
      minSlider.value = 0;
      maxSlider.value = maxLimit;
      updateSlider();
    }

    updateDestBadge();
    updateStudyBadge();
    updateDiscBadge();
    updateIelts();
    updateDuration();

    // Reset badges for other rows
    document.getElementById('intake-badge').textContent = 'Any Month';
    document.getElementById('intake-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    document.getElementById('institution-type-badge').textContent = 'All Types';
    document.getElementById('institution-type-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    document.getElementById('study-mode-badge').textContent = 'All Modes';
    document.getElementById('study-mode-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    document.getElementById('qs-ranking-badge').textContent = 'All Ranks';
    document.getElementById('qs-ranking-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    document.getElementById('tuition-fee-badge').textContent = 'All Fees';
    document.getElementById('tuition-fee-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    document.getElementById('scholarship-badge').textContent = 'Any';
    document.getElementById('scholarship-badge').className = 'text-[11px] font-semibold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md max-w-[125px] truncate';

    if (totalCountEl) totalCountEl.textContent = '233 results';
  }

  const resetAllBtn = document.getElementById('reset-all-btn');
  const footerClearBtn = document.getElementById('footer-clear-btn');
  const applyBtn = document.getElementById('apply-filters-btn');

  if (resetAllBtn) resetAllBtn.addEventListener('click', resetAll);
  if (footerClearBtn) footerClearBtn.addEventListener('click', resetAll);

  if (applyBtn) {
    applyBtn.addEventListener('click', () => {
      const orig = applyBtn.querySelector('span:first-child').textContent;
      applyBtn.querySelector('span:first-child').textContent = 'Filters Applied!';
      applyBtn.classList.add('ring-2', 'ring-amber-400');
      setTimeout(() => {
        applyBtn.querySelector('span:first-child').textContent = orig;
        applyBtn.classList.remove('ring-2', 'ring-amber-400');
      }, 1200);
    });
  }
});
</script>
<!-- END: InteractiveScripts -->
