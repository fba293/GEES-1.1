    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('gees_theme');
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Schema.org EducationalOrganization & Person JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "GEES Global Education Expert Services",
        "url": "https://gees-edu.com",
        "logo": "https://gees-edu.com/logo.png",
        "founder": {
          "@type": "Person",
          "name": "Managing Director & Executive Board",
          "jobTitle": "Managing Director",
          "worksFor": {
            "@type": "Organization",
            "name": "GEES Global Education Expert Services"
          }
        }
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans">
