    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('gees_theme');
          if (
            theme === 'dark' ||
            (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Schema.org DataCatalog JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "DataCatalog",
        "name": "GEES Free International Student Resource Hub",
        "url": "https://gees-edu.com/resources.html",

        "publisher": {
          "@type": "EducationalOrganization",
          "name": "GEES Global Education Expert Services"
        }
      }
    </script>
